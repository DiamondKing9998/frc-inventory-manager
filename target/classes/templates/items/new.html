<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Item</title>
</head>
<body>

<h1>Add Inventory Item</h1>

<form th:action="@{/items}" th:object="${item}" method="post">

    <label>Name:</label>
    <input type="text" th:field="*{name}" required>
    <br>

    <label>Category:</label>
    <input type="text" th:field="*{category}">
    <br>

    <label>Manufacturer:</label>
    <input type="text" th:field="*{manufacturer}">
    <br>

    <label>Part Number:</label>
    <input type="text" th:field="*{partNumber}">
    <br>

    <label>Total Quantity:</label>
    <input type="number" th:field="*{totalQuantity}" min="0">
    <br>

    <label>Reorder Threshold:</label>
    <input type="number" th:field="*{reorderThreshold}" min="0">
    <br>

    <label>Storage Location:</label>
    <input type="text" th:field="*{storageLocation}">
    <br>

    <label>Product URL:</label>
    <input type="url" th:field="*{productUrl}">
    <br>

    <label>Unit Price:</label>
    <input type="number" step="0.01" th:field="*{unitPrice}">
    <br>

    <button type="submit">Save Item</button>

</form>

</body>
</html>

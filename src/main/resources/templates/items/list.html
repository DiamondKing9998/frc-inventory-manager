<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventory</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Inventory</h1>

        <a href="/items/new" class="btn btn-primary">
            Add Item
        </a>
    </div>

    <div class="card shadow-sm">

        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">

                <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Manufacturer</th>
                    <th>Part Number</th>
                    <th>Quantity</th>
                    <th>Reorder At</th>
                    <th>Location</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="item : ${items}">
                    <td th:text="${item.name}"></td>
                    <td th:text="${item.category}"></td>
                    <td th:text="${item.manufacturer}"></td>
                    <td th:text="${item.partNumber}"></td>

                    <td>
                        <span th:text="${item.totalQuantity}"></span>

                        <span
                            th:if="${item.totalQuantity <= item.reorderThreshold}"
                            class="badge bg-warning text-dark ms-1">
                            Low
                        </span>
                    </td>

                    <td th:text="${item.reorderThreshold}"></td>
                    <td th:text="${item.storageLocation}"></td>

                    <td>
                        <div class="d-flex gap-2">

                            <a
                                class="btn btn-sm btn-outline-primary"
                                th:href="@{/items/{id}/edit(id=${item.id})}">
                                Edit
                            </a>

                            <form
                                th:action="@{/items/{id}/delete(id=${item.id})}"
                                method="post">

                                <button
                                    class="btn btn-sm btn-outline-danger"
                                    type="submit"
                                    onclick="return confirm('Delete this item?')">
                                    Delete
                                </button>

                            </form>

                        </div>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(items)}">
                    <td colspan="8" class="text-center text-muted py-4">
                        No inventory items yet.
                    </td>
                </tr>

                </tbody>

            </table>
        </div>

    </div>

</div>

</body>
</html>

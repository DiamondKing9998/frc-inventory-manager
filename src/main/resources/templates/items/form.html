<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${item.id == null} ? 'Add Item' : 'Edit Item'">Item</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <h1 class="mb-4"
        th:text="${item.id == null} ? 'Add Inventory Item' : 'Edit Inventory Item'">
    </h1>

    <form
        th:action="${item.id == null} ? @{/items} : @{/items/{id}(id=${item.id})}"
        th:object="${item}"
        method="post"
        class="card p-4 shadow-sm">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input class="form-control" type="text" th:field="*{name}">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            <input class="form-control" type="text" th:field="*{category}">
        </div>

        <div class="mb-3">
            <label class="form-label">Manufacturer</label>
            <input class="form-control" type="text" th:field="*{manufacturer}">
        </div>

        <div class="mb-3">
            <label class="form-label">Part Number</label>
            <input class="form-control" type="text" th:field="*{partNumber}">

            <div
                class="text-danger"
                th:if="${#fields.hasErrors('partNumber')}"
                th:errors="*{partNumber}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Total Quantity</label>
            <input class="form-control"
                   type="number"
                   min="0"
                   th:field="*{totalQuantity}">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('totalQuantity')}"
                 th:errors="*{totalQuantity}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Reorder Threshold</label>
            <input class="form-control"
                   type="number"
                   min="0"
                   th:field="*{reorderThreshold}">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('reorderThreshold')}"
                 th:errors="*{reorderThreshold}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Storage Location</label>
            <input class="form-control"
                   type="text"
                   th:field="*{storageLocation}">
        </div>

        <div class="mb-3">
            <label class="form-label">Product URL</label>
            <input class="form-control"
                   type="url"
                   th:field="*{productUrl}">
        </div>

        <div class="mb-3">
            <label class="form-label">Unit Price</label>
            <input class="form-control"
                   type="number"
                   step="0.01"
                   min="0"
                   th:field="*{unitPrice}">
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-secondary" href="/items">Cancel</a>
        </div>

    </form>

</div>

</body>
</html>
